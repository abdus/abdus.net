<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1694" viewBox="0 0 720 1694" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="720" height="1694" fill="#fcfcfb"/>
  <text x="32" y="64" font-size="40" font-weight="700" fill="#0b0b0b">Putting a language model in a</text>
  <text x="32" y="117" font-size="40" font-weight="700" fill="#0b0b0b">Flutter app</text>
  <text x="32" y="174" font-size="26" font-weight="400" fill="#52514e">Six more walls, this time on the phone</text>
  <rect x="32" y="226" width="656" height="230" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <text x="58" y="270" font-size="27" font-weight="600" fill="#0b0b0b">Play Protect says no</text>
  <text x="58" y="306" font-size="27" font-weight="400" fill="#52514e">In India it blocks sideloaded apps that ask</text>
  <text x="58" y="342" font-size="27" font-weight="400" fill="#52514e">for SMS access. No override.</text>
  <text x="58" y="378" font-size="25" font-weight="400" fill="#0b0b0b">Fix: install over USB for now; a Play Store</text>
  <text x="58" y="411" font-size="25" font-weight="400" fill="#0b0b0b">listing for real.</text>
  <rect x="32" y="474" width="656" height="194" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <text x="58" y="518" font-size="27" font-weight="600" fill="#0b0b0b">Q4_K_M is too slow</text>
  <text x="58" y="554" font-size="27" font-weight="400" fill="#52514e">About 2 s per SMS on the phone.</text>
  <text x="58" y="590" font-size="25" font-weight="400" fill="#0b0b0b">Fix: Q4_0, which llama.cpp repacks for ARM:</text>
  <text x="58" y="623" font-size="25" font-weight="400" fill="#0b0b0b">~4× faster prompt reading.</text>
  <rect x="32" y="686" width="656" height="230" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <text x="58" y="730" font-size="27" font-weight="600" fill="#0b0b0b">“Illegal instruction”</text>
  <text x="58" y="766" font-size="27" font-weight="400" fill="#52514e">A build using i8mm crashed: the phone's</text>
  <text x="58" y="802" font-size="27" font-weight="400" fill="#52514e">cores don't have it.</text>
  <text x="58" y="838" font-size="25" font-weight="400" fill="#0b0b0b">Fix: build for dotprod + fp16, check the CPU</text>
  <text x="58" y="871" font-size="25" font-weight="400" fill="#0b0b0b">before loading.</text>
  <rect x="32" y="934" width="656" height="230" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <text x="58" y="978" font-size="27" font-weight="600" fill="#0b0b0b">A whole inbox is hours</text>
  <text x="58" y="1014" font-size="27" font-weight="400" fill="#52514e">13,466 messages at ~1.5 s each; background</text>
  <text x="58" y="1050" font-size="27" font-weight="400" fill="#52514e">jobs die at 10 minutes.</text>
  <text x="58" y="1086" font-size="25" font-weight="400" fill="#0b0b0b">Fix: new SMS only, cached answers, opt-in re-</text>
  <text x="58" y="1119" font-size="25" font-weight="400" fill="#0b0b0b">read in 8-minute runs.</text>
  <rect x="32" y="1182" width="656" height="230" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <text x="58" y="1226" font-size="27" font-weight="600" fill="#0b0b0b">352 MB over a bad route</text>
  <text x="58" y="1262" font-size="27" font-weight="400" fill="#52514e">One connection crawled at ~0.7 MB/s,</text>
  <text x="58" y="1298" font-size="27" font-weight="400" fill="#52514e">roughly 8 minutes.</text>
  <text x="58" y="1334" font-size="25" font-weight="400" fill="#0b0b0b">Fix: 4 parallel range requests, resumable,</text>
  <text x="58" y="1367" font-size="25" font-weight="400" fill="#0b0b0b">SHA-256 checked.</text>
  <rect x="32" y="1430" width="656" height="230" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <text x="58" y="1474" font-size="27" font-weight="600" fill="#0b0b0b">JNI mangles text</text>
  <text x="58" y="1510" font-size="27" font-weight="400" fill="#52514e">Java's “modified UTF-8” can't carry every</text>
  <text x="58" y="1546" font-size="27" font-weight="400" fill="#52514e">character back from C++.</text>
  <text x="58" y="1582" font-size="25" font-weight="400" fill="#0b0b0b">Fix: return raw UTF-8 bytes, decode them in</text>
  <text x="58" y="1615" font-size="25" font-weight="400" fill="#0b0b0b">Kotlin.</text>
</svg>
