<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="370" viewBox="0 0 1600 370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1600" height="370" fill="#fcfcfb"/>
  <text x="60" y="70" font-size="34" font-weight="700" fill="#0b0b0b">From labelled SMS to a model on the phone</text>
  <text x="60" y="110" font-size="22" fill="#52514e">Everything ran on a free Colab T4 and a 16 GB MacBook</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8984"/>
    </marker>
  </defs>
  <g font-size="24">
    <!-- row of steps -->
    <g>
      <rect x="60" y="170" width="250" height="150" rx="20" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
      <text x="85" y="215" font-weight="700" fill="#0b0b0b">15,017 SMS</text>
      <text x="85" y="250" fill="#52514e" font-size="20">hand-labelled JSON,</text>
      <text x="85" y="278" fill="#52514e" font-size="20">split by date</text>
    </g>
    <g>
      <rect x="370" y="170" width="250" height="150" rx="20" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
      <text x="395" y="215" font-weight="700" fill="#0b0b0b">Bundle</text>
      <text x="395" y="250" fill="#52514e" font-size="20">chat-format rows,</text>
      <text x="395" y="278" fill="#52514e" font-size="20">owner names swapped</text>
    </g>
    <g>
      <rect x="680" y="170" width="250" height="150" rx="20" fill="#e8f1fb" stroke="#2a78d6" stroke-width="2"/>
      <text x="705" y="215" font-weight="700" fill="#0b0b0b">LoRA on Colab</text>
      <text x="705" y="250" fill="#52514e" font-size="20">Qwen2.5, T4 GPU,</text>
      <text x="705" y="278" fill="#52514e" font-size="20">25–60 min, loss on answer</text>
    </g>
    <g>
      <rect x="990" y="170" width="250" height="150" rx="20" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
      <text x="1015" y="215" font-weight="700" fill="#0b0b0b">Merge + quantise</text>
      <text x="1015" y="250" fill="#52514e" font-size="20">adapter folded in,</text>
      <text x="1015" y="278" fill="#52514e" font-size="20">MLX 4-bit, GGUF Q4</text>
    </g>
    <g>
      <rect x="1300" y="170" width="250" height="150" rx="20" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
      <text x="1325" y="215" font-weight="700" fill="#0b0b0b">Phone</text>
      <text x="1325" y="250" fill="#52514e" font-size="20">352 MB llama.cpp,</text>
      <text x="1325" y="278" fill="#52514e" font-size="20">no server, no API</text>
    </g>
    <g stroke="#8a8984" stroke-width="3" marker-end="url(#a)">
      <line x1="315" y1="245" x2="362" y2="245"/><line x1="625" y1="245" x2="672" y2="245"/>
      <line x1="935" y1="245" x2="982" y2="245"/><line x1="1245" y1="245" x2="1292" y2="245"/>
    </g>
  </g>
</svg>
