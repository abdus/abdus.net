<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1037" viewBox="0 0 720 1037" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="720" height="1037" fill="#fcfcfb"/>
  <text x="32" y="64" font-size="40" font-weight="700" fill="#0b0b0b">On a real phone</text>
  <text x="32" y="121" font-size="26" font-weight="400" fill="#52514e">Measured on a Pixel 7a, Q4_0 model, llama.cpp, 4</text>
  <text x="32" y="155" font-size="26" font-weight="400" fill="#52514e">threads</text>
  <rect x="32" y="207" width="319" height="250" rx="22" fill="#e8f1fb"/>
  <text x="56" y="299" font-size="68" font-weight="300" fill="#0b0b0b">1.5<tspan font-size="36" fill="#52514e"> s</tspan></text>
  <text x="56" y="347" font-size="24" font-weight="600" fill="#0b0b0b">per SMS</text>
  <text x="56" y="378" font-size="21" fill="#52514e">inside the app</text>
  <rect x="369" y="207" width="319" height="250" rx="22" fill="#e8f1fb"/>
  <text x="393" y="299" font-size="68" font-weight="300" fill="#0b0b0b">1.17<tspan font-size="36" fill="#52514e"> s</tspan></text>
  <text x="393" y="347" font-size="24" font-weight="600" fill="#0b0b0b">to load the model</text>
  <text x="393" y="378" font-size="21" fill="#52514e">cold</text>
  <rect x="32" y="475" width="319" height="250" rx="22" fill="#e8f1fb"/>
  <text x="56" y="567" font-size="68" font-weight="300" fill="#0b0b0b">377<tspan font-size="36" fill="#52514e"> / 58</tspan></text>
  <text x="56" y="615" font-size="24" font-weight="600" fill="#0b0b0b">tokens/s</text>
  <text x="56" y="646" font-size="21" fill="#52514e">reading / writing</text>
  <rect x="369" y="475" width="319" height="250" rx="22" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <text x="393" y="567" font-size="68" font-weight="300" fill="#0b0b0b">98.7<tspan font-size="36" fill="#52514e">%</tspan></text>
  <text x="393" y="615" font-size="24" font-weight="600" fill="#0b0b0b">whole object</text>
  <text x="393" y="646" font-size="21" fill="#52514e">2,588 test SMS (rules</text>
  <text x="393" y="674" font-size="21" fill="#52514e">95.3%)</text>
  <rect x="32" y="743" width="319" height="250" rx="22" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <text x="56" y="835" font-size="68" font-weight="300" fill="#0b0b0b">+6.7<tspan font-size="36" fill="#52514e"> MB</tspan></text>
  <text x="56" y="883" font-size="24" font-weight="600" fill="#0b0b0b">APK size</text>
  <text x="56" y="914" font-size="21" fill="#52514e">for llama.cpp (model</text>
  <text x="56" y="942" font-size="21" fill="#52514e">downloaded)</text>
  <rect x="369" y="743" width="319" height="250" rx="22" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <text x="393" y="835" font-size="68" font-weight="300" fill="#0b0b0b">971<tspan font-size="36" fill="#52514e"> MB</tspan></text>
  <text x="393" y="883" font-size="24" font-weight="600" fill="#0b0b0b">memory</text>
  <text x="393" y="914" font-size="21" fill="#52514e">while reading, ~3.4</text>
  <text x="393" y="942" font-size="21" fill="#52514e">cores</text>
</svg>
