<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1600" height="640" fill="#fcfcfb"/>
  <text x="60" y="70" font-size="34" font-weight="700" fill="#0b0b0b">What can a stranger pull out of the public model?</text>
  <text x="60" y="110" font-size="22" fill="#52514e">I attacked my own models before publishing them</text>
  <g font-size="23">
    <!-- row 1 -->
    <rect x="60" y="150" width="1480" height="130" rx="22" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
    <rect x="95" y="187" width="150" height="56" rx="28" fill="#e6f6f0"/>
    <circle cx="125" cy="215" r="9" fill="#1baf7a"/><text x="145" y="224" font-weight="600" fill="#148a60">safe</text>
    <text x="285" y="205" font-size="25" font-weight="700" fill="#0b0b0b">Message text, account numbers, balances, OTPs</text>
    <text x="285" y="243" fill="#52514e">The model was only graded on its JSON answer, never asked to write an SMS. Nothing to recite.</text>
    <!-- row 2 -->
    <rect x="60" y="300" width="1480" height="150" rx="22" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
    <rect x="95" y="347" width="150" height="56" rx="28" fill="#e6f6f0"/>
    <circle cx="125" cy="375" r="9" fill="#1baf7a"/><text x="145" y="384" font-weight="600" fill="#148a60">0 found</text>
    <text x="285" y="355" font-size="25" font-weight="700" fill="#0b0b0b">Names of people I paid (650 in training)</text>
    <text x="285" y="393" fill="#52514e">Blank payees sampled hundreds of times, every two-letter start, even the first three</text>
    <text x="285" y="425" fill="#52514e">letters of each real name: neither the 0.5B nor the 1.5B wrote any of them.</text>
    <!-- row 3 -->
    <rect x="60" y="470" width="1480" height="130" rx="22" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
    <rect x="95" y="507" width="150" height="56" rx="28" fill="#fdf3dc"/>
    <circle cx="125" cy="535" r="9" fill="#eda100"/><text x="145" y="544" font-weight="600" fill="#a06d00">fixed</text>
    <text x="285" y="525" font-size="25" font-weight="700" fill="#0b0b0b">My own name</text>
    <text x="285" y="563" fill="#52514e">The first 1.5B memorised it. The owner-line models never see it; old uploads were deleted.</text>
  </g>
</svg>
