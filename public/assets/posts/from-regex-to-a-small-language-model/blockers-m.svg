<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1463" viewBox="0 0 720 1463" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="720" height="1463" fill="#fcfcfb"/>
  <text x="32" y="64" font-size="40" font-weight="700" fill="#0b0b0b">What broke along the way</text>
  <text x="32" y="121" font-size="26" font-weight="400" fill="#52514e">Five walls I hit training a language model on a</text>
  <text x="32" y="155" font-size="26" font-weight="400" fill="#52514e">laptop and a free GPU</text>
  <rect x="32" y="207" width="656" height="230" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <text x="58" y="251" font-size="27" font-weight="600" fill="#0b0b0b">The Mac froze</text>
  <text x="58" y="287" font-size="27" font-weight="400" fill="#52514e">32 long prompts at once ate all 16 GB of</text>
  <text x="58" y="323" font-size="27" font-weight="400" fill="#52514e">memory.</text>
  <text x="58" y="359" font-size="25" font-weight="400" fill="#0b0b0b">Fix: cap MLX memory, small batches, train on</text>
  <text x="58" y="392" font-size="25" font-weight="400" fill="#0b0b0b">Colab.</text>
  <rect x="32" y="455" width="656" height="230" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <text x="58" y="499" font-size="27" font-weight="600" fill="#0b0b0b">The T4 lies about bf16</text>
  <text x="58" y="535" font-size="27" font-weight="400" fill="#52514e">is_bf16_supported() says True; it only</text>
  <text x="58" y="571" font-size="27" font-weight="400" fill="#52514e">emulates it.</text>
  <text x="58" y="607" font-size="25" font-weight="400" fill="#0b0b0b">Fix: check compute capability 8+, use fp16 on</text>
  <text x="58" y="640" font-size="25" font-weight="400" fill="#0b0b0b">a T4.</text>
  <rect x="32" y="703" width="656" height="230" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <text x="58" y="747" font-size="27" font-weight="600" fill="#0b0b0b">Colab looks frozen</text>
  <text x="58" y="783" font-size="27" font-weight="400" fill="#52514e">The progress bar stops while the GPU keeps</text>
  <text x="58" y="819" font-size="27" font-weight="400" fill="#52514e">working at 100%.</text>
  <text x="58" y="855" font-size="25" font-weight="400" fill="#0b0b0b">Fix: trust nvidia-smi in the Colab terminal,</text>
  <text x="58" y="888" font-size="25" font-weight="400" fill="#0b0b0b">not the UI.</text>
  <rect x="32" y="951" width="656" height="230" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <text x="58" y="995" font-size="27" font-weight="600" fill="#0b0b0b">Free GPUs run out</text>
  <text x="58" y="1031" font-size="27" font-weight="400" fill="#52514e">After ~3 hours of training in a day, Colab</text>
  <text x="58" y="1067" font-size="27" font-weight="400" fill="#52514e">hands out no more T4s.</text>
  <text x="58" y="1103" font-size="25" font-weight="400" fill="#0b0b0b">Fix: wait for the quota to reset, or pay for</text>
  <text x="58" y="1136" font-size="25" font-weight="400" fill="#0b0b0b">compute units.</text>
  <rect x="32" y="1199" width="656" height="230" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <text x="58" y="1243" font-size="27" font-weight="600" fill="#0b0b0b">Banks it never saw</text>
  <text x="58" y="1279" font-size="27" font-weight="400" fill="#52514e">With no HDFC debits in training, the 0.5B</text>
  <text x="58" y="1315" font-size="27" font-weight="400" fill="#52514e">misses HDFC debits.</text>
  <text x="58" y="1351" font-size="25" font-weight="400" fill="#0b0b0b">Fix: more banks in the data; size alone helps</text>
  <text x="58" y="1384" font-size="25" font-weight="400" fill="#0b0b0b">a little.</text>
</svg>
