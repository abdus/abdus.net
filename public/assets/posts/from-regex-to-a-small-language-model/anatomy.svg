<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1600" height="620" fill="#fcfcfb"/>
  <text x="60" y="70" font-size="34" font-weight="700" fill="#0b0b0b">What “reading an SMS” means</text>
  <text x="60" y="110" font-size="22" fill="#52514e">Colours match each field to the words it comes from; the rest are read between the lines</text>
  <!-- the SMS with highlighted spans -->
  <text x="60" y="175" font-size="20" fill="#8a8984">AX-ICICIT-S</text>
  <rect x="50" y="190" width="760" height="230" rx="34" fill="#e9e9eb"/>
  <g font-size="29" fill="#1d1d1f">
    <rect x="390" y="210" width="116" height="42" rx="8" fill="#fbd9cb"/>
    <rect x="545" y="210" width="145" height="42" rx="8" fill="#cde2fb"/>
    <rect x="84" y="256" width="251" height="42" rx="8" fill="#c9eedf"/>
    <text x="90" y="242">ICICI Bank Acct XX851 <tspan id="dir" font-weight="600">debited</tspan> for <tspan id="amt" font-weight="600">Rs 486.50</tspan> on</text>
    <text x="90" y="288"><tspan id="mer" font-weight="600">Zomato Media Pr</tspan> credited. UPI:629310847215.</text>
    <text x="90" y="334" fill="#8a8984">Call 18002662 for dispute. SMS BLOCK 851 to</text>
    <text x="90" y="380" fill="#8a8984">9215676766.</text>
  </g>
  <!-- the JSON -->
  <rect x="980" y="180" width="580" height="380" rx="26" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <g font-family="Menlo, monospace" font-size="25">
    <text x="1015" y="225" fill="#52514e">{</text>
    <text x="1040" y="262"><tspan fill="#52514e">"is_txn": </tspan><tspan fill="#0b0b0b" font-weight="700">true</tspan><tspan fill="#8a8984">,</tspan></text>
    <text x="1040" y="306"><tspan fill="#52514e">"direction": </tspan><tspan fill="#eb6834" font-weight="700">"debit"</tspan><tspan fill="#8a8984">,</tspan></text>
    <text x="1040" y="350"><tspan fill="#52514e">"amount": </tspan><tspan fill="#2a78d6" font-weight="700">486.5</tspan><tspan fill="#8a8984">,</tspan></text>
    <text x="1040" y="394"><tspan fill="#52514e">"currency": </tspan><tspan fill="#0b0b0b" font-weight="700">"INR"</tspan><tspan fill="#8a8984">,</tspan></text>
    <text x="1040" y="438"><tspan fill="#52514e">"merchant": </tspan><tspan fill="#1baf7a" font-weight="700">"Zomato Media Pr"</tspan><tspan fill="#8a8984">,</tspan></text>
    <text x="1040" y="482"><tspan fill="#52514e">"is_transfer": </tspan><tspan fill="#0b0b0b" font-weight="700">false</tspan></text>
    <text x="1015" y="525" fill="#52514e">}</text>
  </g>
  <text x="60" y="490" font-size="21" fill="#52514e">
    <tspan x="60" dy="0"><tspan font-weight="700" fill="#0b0b0b">is_txn</tspan>, <tspan font-weight="700" fill="#0b0b0b">currency</tspan> and <tspan font-weight="700" fill="#0b0b0b">is_transfer</tspan> are never spelled out:</tspan>
    <tspan x="60" dy="32">“INR” is implied by “Rs”, and a payment to Zomato is spending,</tspan>
    <tspan x="60" dy="32">not money moved between your own accounts.</tspan>
  </text>
</svg>
