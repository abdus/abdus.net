<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1300" viewBox="0 0 720 1300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="720" height="1300" fill="#fcfcfb"/>
  <text x="32" y="64" font-size="40" font-weight="700" fill="#0b0b0b">Four messages that fool a naive</text>
  <text x="32" y="117" font-size="40" font-weight="700" fill="#0b0b0b">parser</text>
  <text x="32" y="174" font-size="26" font-weight="400" fill="#52514e">An amount and a rupee sign don't mean money</text>
  <text x="32" y="208" font-size="26" font-weight="400" fill="#52514e">moved</text>
  <rect x="32" y="260" width="656" height="238" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <rect x="58" y="286" width="604" height="98" rx="22" fill="#e9e9eb"/>
  <text x="78" y="320" font-size="25" fill="#1d1d1f">Keep your credit score healthy! Repay Rs</text>
  <text x="78" y="354" font-size="25" fill="#1d1d1f">4,735 by 05-Oct to avoid late fees.</text>
  <rect x="58" y="388" width="282" height="46" rx="23" fill="#ffe8ea"/><circle cx="82" cy="411" r="8" fill="#d70015"/><text x="100" y="419" font-size="23" font-weight="600" fill="#d70015">not a transaction</text>
  <text x="58" y="454" font-size="24" font-weight="400" fill="#52514e">a reminder, nothing paid</text>
  <rect x="32" y="516" width="656" height="238" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <rect x="58" y="542" width="604" height="98" rx="22" fill="#e9e9eb"/>
  <text x="78" y="576" font-size="25" fill="#1d1d1f">482913 is the OTP for your ICICI Bank Card</text>
  <text x="78" y="610" font-size="25" fill="#1d1d1f">transaction of INR 2,999.00 at FLIPKART.</text>
  <rect x="58" y="644" width="282" height="46" rx="23" fill="#ffe8ea"/><circle cx="82" cy="667" r="8" fill="#d70015"/><text x="100" y="675" font-size="23" font-weight="600" fill="#d70015">not a transaction</text>
  <text x="58" y="710" font-size="24" font-weight="400" fill="#52514e">a payment that might happen</text>
  <rect x="32" y="772" width="656" height="238" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <rect x="58" y="798" width="604" height="98" rx="22" fill="#e9e9eb"/>
  <text x="78" y="832" font-size="25" fill="#1d1d1f">Payment of INR 12,840.00 has been received</text>
  <text x="78" y="866" font-size="25" fill="#1d1d1f">on your Credit Card XX4417. Thank you.</text>
  <rect x="58" y="900" width="167" height="46" rx="23" fill="#e8f1fb"/><circle cx="82" cy="923" r="8" fill="#2a78d6"/><text x="100" y="931" font-size="23" font-weight="600" fill="#2a78d6">transfer</text>
  <text x="58" y="966" font-size="24" font-weight="400" fill="#52514e">paying your own bill isn't spending</text>
  <rect x="32" y="1028" width="656" height="238" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <rect x="58" y="1054" width="604" height="98" rx="22" fill="#e9e9eb"/>
  <text x="78" y="1088" font-size="25" fill="#1d1d1f">Acct XX851 debited for Rs 640.00 on 12-Oct;</text>
  <text x="78" y="1122" font-size="25" fill="#1d1d1f">BLUE TOKAI COFF credited. UPI:6…</text>
  <rect x="58" y="1156" width="167" height="46" rx="23" fill="#e6f6f0"/><circle cx="82" cy="1179" r="8" fill="#1baf7a"/><text x="100" y="1187" font-size="23" font-weight="600" fill="#148a60">spending</text>
  <text x="58" y="1222" font-size="24" font-weight="400" fill="#52514e">the bank cut the name at 15 letters</text>
</svg>
