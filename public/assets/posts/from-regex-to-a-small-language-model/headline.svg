<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1600" height="300" fill="#fcfcfb"/>
  <g>
    <rect x="20" y="30" width="370" height="240" rx="26" fill="#e8f1fb"/>
    <text x="55" y="140" font-size="84" font-weight="300" fill="#0b0b0b">98.5<tspan font-size="48">%</tspan></text>
    <text x="57" y="190" font-size="24" fill="#0b0b0b" font-weight="600">transactions fully right</text>
    <text x="57" y="225" font-size="21" fill="#52514e">on SMS it never saw (rules: 93%)</text>
  </g>
  <g>
    <rect x="415" y="30" width="370" height="240" rx="26" fill="#e6f6f0"/>
    <text x="450" y="140" font-size="84" font-weight="300" fill="#0b0b0b">496<tspan font-size="48" fill="#52514e">/496</tspan></text>
    <text x="452" y="190" font-size="24" fill="#0b0b0b" font-weight="600">new bank format, read right</text>
    <text x="452" y="225" font-size="21" fill="#52514e">zero examples of it in training</text>
  </g>
  <g>
    <rect x="810" y="30" width="370" height="240" rx="26" fill="#fdeee7"/>
    <text x="845" y="140" font-size="84" font-weight="300" fill="#0b0b0b">352<tspan font-size="48" fill="#52514e"> MB</tspan></text>
    <text x="847" y="190" font-size="24" fill="#0b0b0b" font-weight="600">on the phone</text>
    <text x="847" y="225" font-size="21" fill="#52514e">0.5B model, 4-bit, llama.cpp</text>
  </g>
  <g>
    <rect x="1205" y="30" width="375" height="240" rx="26" fill="#fdf3dc"/>
    <text x="1240" y="140" font-size="84" font-weight="300" fill="#0b0b0b">23<tspan font-size="48" fill="#52514e"> min</tspan></text>
    <text x="1242" y="190" font-size="24" fill="#0b0b0b" font-weight="600">to train</text>
    <text x="1242" y="225" font-size="21" fill="#52514e">one epoch, free Colab T4 GPU</text>
  </g>
</svg>
