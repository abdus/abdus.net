<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1507" viewBox="0 0 720 1507" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="720" height="1507" fill="#fcfcfb"/>
  <text x="32" y="64" font-size="40" font-weight="700" fill="#0b0b0b">All three still run, in order</text>
  <text x="32" y="117" font-size="40" font-weight="700" fill="#0b0b0b">of trust</text>
  <text x="32" y="174" font-size="26" font-weight="400" fill="#52514e">How Spends decides on each new SMS; each layer</text>
  <text x="32" y="208" font-size="26" font-weight="400" fill="#52514e">only answers when it's sure</text>
  <rect x="32" y="260" width="656" height="128" rx="24" fill="#e9e9eb"/>
  <text x="58" y="304" font-size="27" font-weight="600" fill="#0b0b0b">New SMS</text>
  <text x="58" y="340" font-size="27" font-weight="400" fill="#52514e">business senders only</text>
  <path d="M360 396 L360 428 M348 416 L360 430 L372 416" stroke="#8a8984" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="32" y="452" width="656" height="292" rx="24" fill="#e8f1fb"/>
  <circle cx="68" cy="485" r="10" fill="#2a78d6"/>
  <text x="90" y="496" font-size="31" font-weight="700" fill="#0b0b0b">1 · Language model</text>
  <text x="58" y="537" font-size="23" font-weight="400" fill="#8a8984">opt-in, 352 MB</text>
  <text x="58" y="567" font-size="25" font-weight="400" fill="#52514e">Answers first, but only counts if its JSON is</text>
  <text x="58" y="600" font-size="25" font-weight="400" fill="#52514e">valid and its amount literally appears in the</text>
  <text x="58" y="633" font-size="25" font-weight="400" fill="#52514e">SMS, so a misread ₹1,20,800 for ₹12,080 is</text>
  <text x="58" y="666" font-size="25" font-weight="400" fill="#52514e">thrown out. Runs only on SMS that quote an</text>
  <text x="58" y="699" font-size="25" font-weight="400" fill="#52514e">amount.</text>
  <path d="M360 752 L360 784 M348 772 L360 786 L372 772" stroke="#8a8984" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="386" y="776" font-size="21" fill="#8a8984">not sure</text>
  <rect x="32" y="808" width="656" height="259" rx="24" fill="#e6f6f0"/>
  <circle cx="68" cy="841" r="10" fill="#1baf7a"/>
  <text x="90" y="852" font-size="31" font-weight="700" fill="#0b0b0b">2 · Classic ML</text>
  <text x="58" y="893" font-size="23" font-weight="400" fill="#8a8984">on by default, 1.95 MB, updated over the air</text>
  <text x="58" y="923" font-size="25" font-weight="400" fill="#52514e">P(payment) ≥ 0.8: its answer. ≤ 0.05: not a</text>
  <text x="58" y="956" font-size="25" font-weight="400" fill="#52514e">payment, even if the rules disagree. Anything</text>
  <text x="58" y="989" font-size="25" font-weight="400" fill="#52514e">in between, usually a format it hasn't seen,</text>
  <text x="58" y="1022" font-size="25" font-weight="400" fill="#52514e">falls through.</text>
  <path d="M360 1075 L360 1107 M348 1095 L360 1109 L372 1095" stroke="#8a8984" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="386" y="1099" font-size="21" fill="#8a8984">not sure</text>
  <rect x="32" y="1131" width="656" height="226" rx="24" fill="#fdeee7"/>
  <circle cx="68" cy="1164" r="10" fill="#eb6834"/>
  <text x="90" y="1175" font-size="31" font-weight="700" fill="#0b0b0b">3 · Rules</text>
  <text x="58" y="1216" font-size="23" font-weight="400" fill="#8a8984">always run</text>
  <text x="58" y="1246" font-size="25" font-weight="400" fill="#52514e">The last word. They also always pull the</text>
  <text x="58" y="1279" font-size="25" font-weight="400" fill="#52514e">account number and UPI reference, whichever</text>
  <text x="58" y="1312" font-size="25" font-weight="400" fill="#52514e">layer decided the rest.</text>
  <text x="32" y="1401" font-size="23" font-weight="400" fill="#52514e">Every model answer is cached per SMS, so re-scans and</text>
  <text x="32" y="1431" font-size="23" font-weight="400" fill="#52514e">restores never re-run the model or quietly fall back</text>
  <text x="32" y="1461" font-size="23" font-weight="400" fill="#52514e">to the rules.</text>
</svg>
