<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1031" viewBox="0 0 720 1031" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="720" height="1031" fill="#fcfcfb"/>
  <text x="32" y="64" font-size="40" font-weight="700" fill="#0b0b0b">What can a stranger pull out of</text>
  <text x="32" y="117" font-size="40" font-weight="700" fill="#0b0b0b">the public model?</text>
  <text x="32" y="174" font-size="26" font-weight="400" fill="#52514e">I attacked my own models before publishing them</text>
  <rect x="32" y="226" width="656" height="269" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <rect x="58" y="246" width="115" height="46" rx="23" fill="#e6f6f0"/><circle cx="82" cy="269" r="8" fill="#1baf7a"/><text x="100" y="277" font-size="23" font-weight="600" fill="#148a60">safe</text>
  <text x="58" y="312" font-size="27" font-weight="600" fill="#0b0b0b">Message text, account numbers, balances,</text>
  <text x="58" y="348" font-size="27" font-weight="600" fill="#0b0b0b">OTPs</text>
  <text x="58" y="384" font-size="25" font-weight="400" fill="#52514e">The model was only graded on its JSON answer,</text>
  <text x="58" y="417" font-size="25" font-weight="400" fill="#52514e">never asked to write an SMS. Nothing to</text>
  <text x="58" y="450" font-size="25" font-weight="400" fill="#52514e">recite.</text>
  <rect x="32" y="513" width="656" height="266" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <rect x="58" y="533" width="154" height="46" rx="23" fill="#e6f6f0"/><circle cx="82" cy="556" r="8" fill="#1baf7a"/><text x="100" y="564" font-size="23" font-weight="600" fill="#148a60">0 found</text>
  <text x="58" y="599" font-size="27" font-weight="600" fill="#0b0b0b">Names of people I paid (650 in training)</text>
  <text x="58" y="635" font-size="25" font-weight="400" fill="#52514e">Blank payees sampled hundreds of times, every</text>
  <text x="58" y="668" font-size="25" font-weight="400" fill="#52514e">two-letter start, even the first three letters</text>
  <text x="58" y="701" font-size="25" font-weight="400" fill="#52514e">of each real name: neither the 0.5B nor the</text>
  <text x="58" y="734" font-size="25" font-weight="400" fill="#52514e">1.5B wrote any of them.</text>
  <rect x="32" y="797" width="656" height="200" rx="24" fill="#ffffff" stroke="#e6e5e1" stroke-width="2"/>
  <rect x="58" y="817" width="128" height="46" rx="23" fill="#fdf3dc"/><circle cx="82" cy="840" r="8" fill="#eda100"/><text x="100" y="848" font-size="23" font-weight="600" fill="#a06d00">fixed</text>
  <text x="58" y="883" font-size="27" font-weight="600" fill="#0b0b0b">My own name</text>
  <text x="58" y="919" font-size="25" font-weight="400" fill="#52514e">The first 1.5B memorised it. The owner-line</text>
  <text x="58" y="952" font-size="25" font-weight="400" fill="#52514e">models never see it.</text>
</svg>
