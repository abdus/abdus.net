<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1600" height="760" fill="#fcfcfb"/>
  <text x="60" y="70" font-size="34" font-weight="700" fill="#0b0b0b">Four messages that fool a naive parser</text>
  <text x="60" y="110" font-size="22" fill="#52514e">An amount and a rupee sign don't mean money moved</text>
  <g font-size="25" fill="#1d1d1f">
    <!-- 1 -->
    <rect x="60" y="150" width="720" height="250" rx="30" fill="#e9e9eb"/>
    <text x="95" y="205">Keep your credit score healthy! Repay</text>
    <text x="95" y="242">Rs 4,735 by 05-Oct to avoid late fees.</text>
    <rect x="95" y="300" width="250" height="56" rx="28" fill="#ffe8ea"/>
    <circle cx="125" cy="328" r="9" fill="#d70015"/>
    <text x="145" y="337" font-size="22" fill="#d70015" font-weight="600">not a transaction</text>
    <text x="370" y="337" font-size="21" fill="#52514e">a reminder, nothing paid</text>
    <!-- 2 -->
    <rect x="820" y="150" width="720" height="250" rx="30" fill="#e9e9eb"/>
    <text x="855" y="205">482913 is the OTP for your ICICI Bank Card</text>
    <text x="855" y="242">transaction of INR 2,999.00 at FLIPKART.</text>
    <rect x="855" y="300" width="250" height="56" rx="28" fill="#ffe8ea"/>
    <circle cx="885" cy="328" r="9" fill="#d70015"/>
    <text x="905" y="337" font-size="22" fill="#d70015" font-weight="600">not a transaction</text>
    <text x="1130" y="337" font-size="21" fill="#52514e">a payment that might happen</text>
    <!-- 3 -->
    <rect x="60" y="440" width="720" height="250" rx="30" fill="#e9e9eb"/>
    <text x="95" y="495">Payment of INR 12,840.00 has been received</text>
    <text x="95" y="532">on your Credit Card XX4417. Thank you.</text>
    <rect x="95" y="590" width="190" height="56" rx="28" fill="#e8f1fb"/>
    <circle cx="125" cy="618" r="9" fill="#2a78d6"/>
    <text x="145" y="627" font-size="22" fill="#2a78d6" font-weight="600">transfer</text>
    <text x="310" y="627" font-size="21" fill="#52514e">paying your own bill isn't spending</text>
    <!-- 4 -->
    <rect x="820" y="440" width="720" height="250" rx="30" fill="#e9e9eb"/>
    <text x="855" y="495">Acct XX851 debited for Rs 640.00 on 12-Oct;</text>
    <text x="855" y="532"><tspan font-weight="600">BLUE TOKAI COFF</tspan> credited. UPI:6…</text>
    <rect x="855" y="590" width="200" height="56" rx="28" fill="#e6f6f0"/>
    <circle cx="885" cy="618" r="9" fill="#1baf7a"/>
    <text x="905" y="627" font-size="22" fill="#148a60" font-weight="600">spending</text>
    <text x="1080" y="627" font-size="21" fill="#52514e">the bank cut the name at 15 letters</text>
  </g>
</svg>
